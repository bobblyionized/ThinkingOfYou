name: ThinkingOfYou

options:
  bundleIdPrefix: com.thinkingofyou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# Signing is intentionally disabled: CI produces an UNSIGNED ThinkingOfYou.ipa
# and the user re-signs it with their own sideloading tool. The (empty)
# entitlements file is still referenced and embedded by `ldid -S` in CI so the
# signer has something well-formed to carry over.
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_PREVIEWS: "YES"

targets:

  # ---------------------------------------------------------------- App
  ThinkingOfYou:
    type: application
    platform: iOS
    sources:
      - path: ThinkingOfYou
        excludes:
          - "**/Info.plist"
          - "**/*.entitlements"
          - "**/*.md"
          - "**/*.js"
      # The Instagram cage script is loaded at runtime from the bundle
      # (Bundle.main.url(forResource: "Cage", withExtension: "js")).
      - path: ThinkingOfYou/Instagram/Cage.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkingofyou.app
        PRODUCT_NAME: ThinkingOfYou
        INFOPLIST_FILE: ThinkingOfYou/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThinkingOfYou/App/ThinkingOfYou.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # ThinkingOfYou/Resources/Assets.xcassets/AppIcon.appiconset
        # (regenerate with: python3 scripts/make_icon.py <out.png>)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"

  # ---------------------------------------------------------------- Tests
  ThinkingOfYouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThinkingOfYouTests
    dependencies:
      - target: ThinkingOfYou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thinkingofyou.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ThinkingOfYou:
    build:
      targets:
        ThinkingOfYou: all
        ThinkingOfYouTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ThinkingOfYouTests
    archive:
      config: Release
